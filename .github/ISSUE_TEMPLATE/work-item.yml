name: 作業項目
description: 機能追加、不具合修正、リファクタリング、Foundationの改善
title: ""
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: 変更種別
      options:
        - 機能追加
        - 不具合修正
        - リファクタリング
        - 文書
        - CI / ツール
        - Foundationの契約
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 1つの独立して理解できる作業目的を記載します。
      placeholder: 何を改善・実現するか
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: 変更対象
      description: 分かっている範囲を選択します。作業中に必要な対象を追加できます。
      multiple: true
      options:
        - 製品の振る舞い
        - UI・UX
        - UI基盤
        - ドメイン・データ
        - 外部連携・信頼境界
        - アーキテクチャ・実行基盤
        - CI・配備・運用
        - 局所的な実装・リファクタリング
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 関連仕様・制約
      description: 参照する文書や維持すべき動作があれば記載します。既存文書を全文コピーしないでください。
      placeholder: |
        - 関連: docs/...
        - 維持する既存動作:
    validations:
      required: false

  - type: textarea
    id: non_goals
    attributes:
      label: 対象外
      description: 今回行わない隣接作業がある場合だけ記載します。
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了を確認できる条件を記載します。
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 必要な検証
      description: 特に必要なテスト、UI表示確認、セキュリティ確認などがあれば記載します。
    validations:
      required: false
