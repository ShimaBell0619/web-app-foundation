name: Finish Issue 53

on:
  push:
    branches:
      - feat/issue-53-retire-pages

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/issue-53-retire-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Reuse bounded transformation and validate full target state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const { parse } = require('yaml');
          const workflow = parse(fs.readFileSync('.github/workflows/apply-issue-53.yml', 'utf8'));
          const step = workflow.jobs.apply.steps.find((candidate) => candidate.name === 'Apply bounded Pages retirement');
          if (!step?.run) throw new Error('bounded transformation step not found');
          fs.writeFileSync('/tmp/apply-issue-53.py', step.run);
          NODE
          python /tmp/apply-issue-53.py
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:test:web-ci
          npm run foundation:test:vercel-staging
          npm run foundation:test:release
          npm run foundation:release-validate

      - name: Commit only non-workflow portion
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .changeset/calm-pages-retire.md
          python - <<'PY'
          import subprocess
          expected = {
              '.changeset/calm-pages-retire.md',
              'README.md',
              'docs/adoption.md',
              'docs/pages.md',
              'docs/vercel.md',
              'fixtures/pages-consumer/package-lock.json',
              'fixtures/pages-consumer/package.json',
              'fixtures/pages-consumer/scripts/build.mjs',
              'package.json',
              'scripts/test-foundation-validator.mjs',
              'scripts/test-pages-bootstrap-contract.mjs',
              'scripts/test-web-pages-contract.mjs',
              'scripts/validate-foundation.mjs',
              'templates/github-pages/capture-pr-preview.mjs',
              'templates/github-pages/pages-publish.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == expected, f'unexpected staged paths: {sorted(actual)}'
          PY
          git commit -m "refactor!: retire Pages capability implementation"
          git push origin HEAD:feat/issue-53-retire-pages
