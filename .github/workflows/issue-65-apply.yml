name: Apply Issue 65 hardening

on:
  push:
    branches:
      - fix/issue-65-workflow-release-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-65-workflow-release-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply bounded change batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-65-apply.yml
          python - <<'PY'
          import base64
          exec(base64.b64decode(' '))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate bounded change batch
        shell: bash
        run: |
          set -euo pipefail
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:test:web-ci
          npm run foundation:test:application-release
          npm run foundation:test:vercel-staging
          npm run foundation:test:release
          npm run foundation:release-validate

      - name: Commit validated change batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          python - <<'PY'
          import subprocess
          expected = {
            '.changeset/bright-workflows-verify.md',
            '.github/workflows/foundation-ci.yml',
            'docs/application-releases.md',
            'package.json',
            'scripts/test-application-release-contract.mjs',
            'scripts/test-foundation-validator.mjs',
            'scripts/validate-foundation.mjs',
            'templates/release/release.yml',
            '.github/workflows/issue-65-apply.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
            raise SystemExit(f'unexpected staged files: {sorted(actual)}')
          PY
          git commit -m "fix: harden workflow template and release contracts"
          git push origin HEAD:fix/issue-65-workflow-release-hardening
