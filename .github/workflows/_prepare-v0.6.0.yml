name: Prepare v0.6.0 release

on:
  push:
    branches: [release/v0.6.0]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.6.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate and validate release state
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run version:tooling
          npm run version-packages

          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "0.6.0" ]]; then
            echo "Expected v0.6.0 after consuming Changesets, got v$version" >&2
            exit 1
          fi

          rm .github/workflows/_prepare-v0.6.0.yml

          npm run foundation:validate
          npm run foundation:test
          npm run foundation:release-validate

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: release v0.6.0'
          git push origin HEAD:release/v0.6.0
