name: Prepare v0.8.1 Release State

on:
  push:
    branches: [release/v0.8.1]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.8.1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate release state
        run: |
          set -euo pipefail
          npm run version-packages
          node -e "const p=require('./package.json'); if(p.version!=='0.8.1') throw new Error('expected 0.8.1, got '+p.version)"

      - name: Validate generated release state
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v081.yml
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:test:web-ci
          npm run foundation:test:application-release
          npm run foundation:test:vercel-staging
          npm run foundation:test:release
          npm run foundation:release-validate

      - name: Commit generated release state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md AGENTS.md CHANGELOG.md
          git add -u .changeset
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged"
          [[ "$staged" == *'package.json'* ]]
          [[ "$staged" == *'package-lock.json'* ]]
          [[ "$staged" == *'README.md'* ]]
          [[ "$staged" == *'AGENTS.md'* ]]
          [[ "$staged" == *'CHANGELOG.md'* ]]
          [[ "$staged" == *'.changeset/bright-workflows-verify.md'* ]]
          [[ "$staged" == *'.changeset/fixed-staging-run-name.md'* ]]
          git commit -m 'chore: release v0.8.1'
          git push origin HEAD:release/v0.8.1
