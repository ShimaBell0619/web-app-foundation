name: Apply Issue 65 hardening v2

on:
  push:
    branches:
      - fix/issue-65-workflow-release-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-65-workflow-release-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply bounded transformation
        run: |
          set -euo pipefail
          python .tmp/issue-65-apply.py
          rm .tmp/issue-65-apply.py
          rm .github/workflows/issue-65-apply.yml
          rm .github/workflows/issue-65-apply-v2.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate bounded change batch
        run: |
          set -euo pipefail
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:test:web-ci
          npm run foundation:test:application-release
          npm run foundation:test:vercel-staging
          npm run foundation:test:release
          npm run foundation:release-validate

      - name: Commit validated change batch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden workflow template and release contracts"
          git push origin HEAD:fix/issue-65-workflow-release-hardening
