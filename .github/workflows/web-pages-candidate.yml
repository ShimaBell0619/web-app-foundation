name: Reusable web Pages candidate

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the consumer application.
        required: false
        type: string
        default: .
      node_version_file:
        description: Node version file relative to the repository root.
        required: false
        type: string
        default: .node-version
      cache_dependency_path:
        description: npm lockfile path used by setup-node caching.
        required: false
        type: string
        default: package-lock.json
      build_command:
        description: Build command. PAGES_BASE_PATH is available to the command.
        required: false
        type: string
        default: npm run build -- --base="$PAGES_BASE_PATH"
      output_directory:
        description: Built static-site directory relative to working_directory.
        required: false
        type: string
        default: dist
      enable_review_images:
        description: Capture mobile/desktop review images for pull requests.
        required: false
        type: boolean
        default: true
      browser_install_command:
        description: Install the locked browser used by the capture command.
        required: false
        type: string
        default: ./node_modules/.bin/playwright install --with-deps chromium
      capture_command:
        description: Review capture command. PAGES_REVIEW_DIR and PAGES_BASE_PATH are available.
        required: false
        type: string
        default: node scripts/capture-pr-preview.mjs
      artifact_retention_days:
        description: Candidate artifact retention in days.
        required: false
        type: number
        default: 2

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build Pages candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Resolve Pages target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              if [[ -z "${PR_NUMBER:-}" || "$PR_NUMBER" == '0' ]]; then
                echo 'pull_request candidate requires a PR number' >&2
                exit 1
              fi
              echo "base=/${REPO_NAME}/pr-${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo 'target=preview' >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
              echo 'pr_number=0' >> "$GITHUB_OUTPUT"
              echo 'target=production' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported caller event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working_directory }}

      - name: Build Pages candidate
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.target.outputs.base }}
        run: ${{ inputs.build_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Install browser for PR review images
        if: github.event_name == 'pull_request' && inputs.enable_review_images
        shell: bash
        run: ${{ inputs.browser_install_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Capture PR review images
        if: github.event_name == 'pull_request' && inputs.enable_review_images
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.target.outputs.base }}
          PAGES_REVIEW_DIR: ${{ runner.temp }}/pages-review
        run: ${{ inputs.capture_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Assemble candidate artifact
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
          REVIEW_DIRECTORY: ${{ runner.temp }}/pages-review
          ENABLE_REVIEW_IMAGES: ${{ inputs.enable_review_images }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ steps.target.outputs.target }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PAGES_BASE_PATH: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/web-pages-candidate"
          site_dir="${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}/${OUTPUT_DIRECTORY}"

          if [[ ! -d "$site_dir" ]]; then
            echo "built site directory not found: $site_dir" >&2
            exit 1
          fi
          if [[ ! -f "$site_dir/index.html" ]]; then
            echo "built site must contain index.html: $site_dir" >&2
            exit 1
          fi

          rm -rf "$candidate_dir"
          mkdir -p "$candidate_dir/site"
          cp -a "$site_dir/." "$candidate_dir/site/"

          if [[ "$TARGET" == 'preview' && "$ENABLE_REVIEW_IMAGES" == 'true' ]]; then
            for image in mobile.png desktop.png; do
              if [[ ! -f "$REVIEW_DIRECTORY/$image" ]]; then
                echo "review image missing: $image" >&2
                exit 1
              fi
            done
            mkdir -p "$candidate_dir/review"
            cp -a "$REVIEW_DIRECTORY/." "$candidate_dir/review/"
          fi

          node - "$candidate_dir/metadata.json" <<'NODE'
          const { writeFileSync } = require('node:fs');
          const path = process.argv[2];
          const metadata = {
            sourceSha: process.env.SOURCE_SHA,
            target: process.env.TARGET,
            prNumber: Number(process.env.PR_NUMBER),
            basePath: process.env.PAGES_BASE_PATH,
            reviewImages: process.env.ENABLE_REVIEW_IMAGES === 'true' && process.env.TARGET === 'preview',
          };
          writeFileSync(path, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Upload Pages candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-pages-candidate
          path: ${{ runner.temp }}/web-pages-candidate
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          include-hidden-files: true
