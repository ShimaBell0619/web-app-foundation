name: Prepare v0.3.0 release

on:
  push:
    branches: [release/v0.3.0]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Generate version changes
        run: npm run version-packages

      - name: Assert target version
        run: node -e "const p=require('./package.json'); if(p.version!=='0.3.0') throw new Error('expected 0.3.0, got '+p.version)"

      - name: Remove temporary release workflow before validation
        run: git rm .github/workflows/prepare-v0.3.0.yml

      - name: Validate generated release state
        run: |
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:test:web-ci
          npm run foundation:test:web-pages
          npm run foundation:test:release
          npm run foundation:release-validate

      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare v0.3.0'
          git push origin HEAD:release/v0.3.0
