name: Prepare Foundation Release Once

on:
  push:
    branches: [chore/release-0.10.0]
    paths: [.github/workflows/prepare-release-once.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/release-0.10.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked tooling
        run: npm ci

      - name: Validate pre-release state
        run: |
          npm run foundation:validate
          npm run foundation:test
          npm run version:tooling

      - name: Generate Changesets release state
        run: npm run version-packages

      - name: Validate generated v0.10.0 state
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.10.0') throw new Error('expected 0.10.0, got '+p.version)"
          npm run foundation:validate
          npm run foundation:test
          npm run foundation:release-validate

      - name: Commit only generated release metadata and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-release-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md AGENTS.md CHANGELOG.md
          git add -u .changeset/on-demand-preview-default.md .github/workflows/prepare-release-once.yml

          expected=$(printf '%s\n' \
            '.changeset/on-demand-preview-default.md' \
            '.github/workflows/prepare-release-once.yml' \
            'AGENTS.md' \
            'CHANGELOG.md' \
            'README.md' \
            'package-lock.json' \
            'package.json' | sort)
          actual=$(git diff --cached --name-only | sort)
          [[ "$actual" == "$expected" ]]

          git commit -m 'chore: version packages for 0.10.0'
          git push origin HEAD:chore/release-0.10.0
