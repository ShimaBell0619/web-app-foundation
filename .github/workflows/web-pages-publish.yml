name: Reusable web Pages publish

on:
  workflow_call:
    inputs:
      operation:
        description: publish or cleanup.
        required: true
        type: string
      publish_target:
        description: production or preview.
        required: true
        type: string
      source_run_id:
        description: Successful CI workflow run containing the Pages candidate artifact.
        required: false
        type: number
        default: 0
      source_sha:
        description: Exact source SHA associated with the successful CI workflow run.
        required: false
        type: string
        default: ''
      pr_number:
        description: Pull request number for preview publish/cleanup; 0 for production.
        required: false
        type: number
        default: 0
      production_branch:
        description: Branch allowed to publish the production root.
        required: false
        type: string
        default: main
      validated_workflow_name:
        description: Name of the CI workflow that must have completed successfully.
        required: false
        type: string
        default: CI
      expect_review_images:
        description: Require and publish mobile/desktop screenshots for PR previews.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: web-pages-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Pages site
    if: inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.publish_target == 'preview' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ inputs.publish_target == 'preview' && format('https://{0}.github.io/{1}/pr-{2}/', github.repository_owner, github.event.repository.name, inputs.pr_number) || steps.deployment.outputs.page_url }}

    steps:
      - name: Validate trusted publish context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.publish_target }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRODUCTION_BRANCH: ${{ inputs.production_branch }}
          VALIDATED_WORKFLOW_NAME: ${{ inputs.validated_workflow_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != 'workflow_run' ]]; then
            echo 'publish must be called from a workflow_run-triggered caller' >&2
            exit 1
          fi
          if [[ "$WORKFLOW_RUN_NAME" != "$VALIDATED_WORKFLOW_NAME" ]]; then
            echo 'triggering workflow name does not match the configured validation workflow' >&2
            exit 1
          fi
          if [[ "$WORKFLOW_RUN_CONCLUSION" != 'success' ]]; then
            echo 'source workflow run must have conclusion=success' >&2
            exit 1
          fi
          if [[ "$RUN_ID" != "$WORKFLOW_RUN_ID" ]]; then
            echo 'source_run_id does not match the triggering workflow run' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$SOURCE_SHA" != "$WORKFLOW_RUN_SHA" ]]; then
            echo 'source_sha must be the triggering workflow run head SHA' >&2
            exit 1
          fi
          if [[ "$WORKFLOW_RUN_REPOSITORY" != "$REPOSITORY" ]]; then
            echo 'privileged publish only accepts source workflows from this repository' >&2
            exit 1
          fi

          case "$TARGET" in
            production)
              if [[ "$WORKFLOW_RUN_EVENT" != 'push' || "$WORKFLOW_RUN_BRANCH" != "$PRODUCTION_BRANCH" ]]; then
                echo 'production publish requires a successful push workflow on the production branch' >&2
                exit 1
              fi
              if [[ "$PR_NUMBER" != '0' ]]; then
                echo 'production publish requires pr_number=0' >&2
                exit 1
              fi
              ;;
            preview)
              if [[ "$WORKFLOW_RUN_EVENT" != 'pull_request' ]]; then
                echo 'preview publish requires a pull_request source workflow' >&2
                exit 1
              fi
              if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || "$PR_NUMBER" != "$WORKFLOW_RUN_PR_NUMBER" ]]; then
                echo 'preview pr_number must match the triggering workflow run PR' >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported publish_target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Download validated Pages candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-pages-candidate
          path: ${{ runner.temp }}/web-pages-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate candidate manifest
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/web-pages-candidate
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.publish_target }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.publish_target == 'preview' && format('/{0}/pr-{1}/', github.event.repository.name, inputs.pr_number) || format('/{0}/', github.event.repository.name) }}
          EXPECT_REVIEW_IMAGES: ${{ inputs.expect_review_images }}
        run: |
          set -euo pipefail

          if [[ ! -f "$CANDIDATE_DIR/site/index.html" || ! -f "$CANDIDATE_DIR/metadata.json" ]]; then
            echo 'candidate artifact is missing site/index.html or metadata.json' >&2
            exit 1
          fi
          if [[ -n "$(find "$CANDIDATE_DIR" -type l -print -quit)" ]]; then
            echo 'candidate artifact must not contain symbolic links' >&2
            exit 1
          fi

          node - "$CANDIDATE_DIR/metadata.json" <<'NODE'
          const { readFileSync } = require('node:fs');
          const metadata = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const expected = {
            sourceSha: process.env.SOURCE_SHA,
            target: process.env.TARGET,
            prNumber: Number(process.env.PR_NUMBER),
            basePath: process.env.EXPECTED_BASE,
            reviewImages: process.env.EXPECT_REVIEW_IMAGES === 'true' && process.env.TARGET === 'preview',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (metadata[key] !== value) {
              throw new Error(`candidate metadata mismatch for ${key}: expected ${JSON.stringify(value)}, got ${JSON.stringify(metadata[key])}`);
            }
          }
          NODE

          if [[ "$TARGET" == 'preview' && "$EXPECT_REVIEW_IMAGES" == 'true' ]]; then
            for image in mobile.png desktop.png; do
              if [[ ! -f "$CANDIDATE_DIR/review/$image" ]]; then
                echo "candidate review image missing: $image" >&2
                exit 1
              fi
            done
          fi

      - name: Stage persistent Pages content
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/web-pages-candidate
          TARGET: ${{ inputs.publish_target }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECT_REVIEW_IMAGES: ${{ inputs.expect_review_images }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_dir="${RUNNER_TEMP}/pages-content"
          deploy_dir="${RUNNER_TEMP}/pages-deploy"
          staging_branch='pages-content'

          render_preview_index() {
            {
              printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web preview</title><body><main><h1>Web preview</h1><p>Production has not been published yet.</p><ul>'
              for preview in "$publish_dir"/pr-*; do
                [[ -d "$preview" ]] || continue
                name="$(basename "$preview")"
                [[ "$name" =~ ^pr-[0-9]+$ ]] || continue
                printf '<li><a href="./%s/">%s</a></li>\n' "$name" "$name"
              done
              printf '%s\n' '</ul></main></body></html>'
            } > "$publish_dir/index.html"
          }

          if git ls-remote --exit-code "$remote" "refs/heads/${staging_branch}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$staging_branch" "$remote" "$publish_dir"
          else
            mkdir -p "$publish_dir"
            git -C "$publish_dir" init -b "$staging_branch"
          fi

          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "$TARGET" == 'production' ]]; then
            find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git ! -name 'pr-*' -exec rm -rf {} +
            cp -a "$CANDIDATE_DIR/site/." "$publish_dir/"
          else
            target_path="pr-${PR_NUMBER}"
            rm -rf "$publish_dir/$target_path"
            mkdir -p "$publish_dir/$target_path"
            cp -a "$CANDIDATE_DIR/site/." "$publish_dir/$target_path/"

            if [[ "$EXPECT_REVIEW_IMAGES" == 'true' ]]; then
              mkdir -p "$publish_dir/$target_path/review"
              cp -a "$CANDIDATE_DIR/review/." "$publish_dir/$target_path/review/"
            fi

            if [[ -f "$publish_dir/.preview-root-placeholder" || ! -f "$publish_dir/index.html" ]]; then
              touch "$publish_dir/.preview-root-placeholder"
              render_preview_index
            fi
          fi

          git -C "$publish_dir" add -A
          if ! git -C "$publish_dir" diff --cached --quiet; then
            publish_label='production'
            if [[ "$TARGET" == 'preview' ]]; then
              publish_label="pr-${PR_NUMBER}"
            fi
            git -C "$publish_dir" commit -m "chore(pages): publish ${publish_label}"
            git -C "$publish_dir" push "$remote" "HEAD:${staging_branch}"
          fi

          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          rsync -a --exclude=.git "$publish_dir/" "$deploy_dir/"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.stage.outputs.deploy_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Upsert PR preview comment
        if: inputs.publish_target == 'preview'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECT_REVIEW_IMAGES: ${{ inputs.expect_review_images }}
        run: |
          set -euo pipefail
          marker='<!-- web-foundation-pages-preview -->'
          short_sha="${SOURCE_SHA:0:7}"
          preview_base="https://${REPO_OWNER}.github.io/${REPO_NAME}/pr-${PR_NUMBER}"

          if [[ "$EXPECT_REVIEW_IMAGES" == 'true' ]]; then
            body=$(cat <<EOF
          ${marker}
          ## UI preview

          [Open interactive preview](${preview_base}/)

          **Mobile · 390px**

          ![Mobile preview](${preview_base}/review/mobile.png?v=${SOURCE_SHA})

          <details>
          <summary>Desktop · 1440px</summary>

          ![Desktop preview](${preview_base}/review/desktop.png?v=${SOURCE_SHA})
          </details>

          Updated for ${short_sha}.
          EOF
            )
          else
            body=$(cat <<EOF
          ${marker}
          ## UI preview

          [Open interactive preview](${preview_base}/)

          Updated for ${short_sha}. Review images are disabled for this consumer.
          EOF
            )
          fi

          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- web-foundation-pages-preview -->")) | .id' | head -n 1)

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  cleanup:
    name: Remove closed PR preview
    if: inputs.operation == 'cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Validate trusted cleanup context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET: ${{ inputs.publish_target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'pull_request_target' || "$ACTION" != 'closed' ]]; then
            echo 'cleanup must be called from pull_request_target: closed' >&2
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo 'cleanup is only valid for same-repository PR previews' >&2
            exit 1
          fi
          if [[ "$TARGET" != 'preview' || ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || "$PR_NUMBER" != "$EVENT_PR_NUMBER" ]]; then
            echo 'cleanup target/PR does not match the closed pull request' >&2
            exit 1
          fi

      - name: Remove preview from persistent Pages content
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_dir="${RUNNER_TEMP}/pages-content"
          deploy_dir="${RUNNER_TEMP}/pages-deploy"
          staging_branch='pages-content'

          render_preview_index() {
            {
              printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web preview</title><body><main><h1>Web preview</h1><p>Production has not been published yet.</p><ul>'
              for preview in "$publish_dir"/pr-*; do
                [[ -d "$preview" ]] || continue
                name="$(basename "$preview")"
                [[ "$name" =~ ^pr-[0-9]+$ ]] || continue
                printf '<li><a href="./%s/">%s</a></li>\n' "$name" "$name"
              done
              printf '%s\n' '</ul></main></body></html>'
            } > "$publish_dir/index.html"
          }

          if ! git ls-remote --exit-code "$remote" "refs/heads/${staging_branch}" >/dev/null 2>&1; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git clone --depth 1 --branch "$staging_branch" "$remote" "$publish_dir"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          target_path="pr-${PR_NUMBER}"
          if [[ ! -d "$publish_dir/$target_path" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf "$publish_dir/$target_path"
          if [[ -f "$publish_dir/.preview-root-placeholder" ]]; then
            render_preview_index
          fi

          git -C "$publish_dir" add -A
          git -C "$publish_dir" commit -m "chore(pages): remove ${target_path}"
          git -C "$publish_dir" push "$remote" "HEAD:${staging_branch}"

          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          rsync -a --exclude=.git "$publish_dir/" "$deploy_dir/"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload cleaned Pages artifact
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.cleanup.outputs.deploy_dir }}

      - name: Deploy cleaned Pages site
        if: steps.cleanup.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Mark PR preview comment closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- web-foundation-pages-preview -->")) | .id' | head -n 1)

          if [[ -n "$comment_id" ]]; then
            body='<!-- web-foundation-pages-preview -->
          ## UI preview

          Preview removed because this pull request is closed.'
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          fi
