name: Publisher repro caller

on:
  push:
    branches: [fix/issue-22-publisher-permissions]

permissions:
  contents: read

jobs:
  call:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    uses: ./.github/workflows/web-pages-publish.yml
    with:
      operation: cleanup
      publish_target: preview
      pr_number: 1
      expect_review_images: true
