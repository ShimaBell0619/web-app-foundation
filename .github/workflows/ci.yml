name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reproducible install
        run: npm ci

      - name: Validate Foundation contracts
        run: npm run foundation:validate

      - name: Run validator regression tests
        run: npm run foundation:test

      - name: Run reusable CI contract tests
        run: npm run foundation:test:web-ci

      - name: Run application Release profile contract tests
        run: npm run foundation:test:application-release

      - name: Run fixed Staging profile contract tests
        run: npm run foundation:test:vercel-staging

      - name: Exercise release cycle
        run: npm run foundation:test:release

      - name: Validate current release metadata
        run: npm run foundation:release-validate

      - name: Verify locked Changesets CLI
        run: npm run version:tooling

  consumer-smoke:
    uses: ./.github/workflows/web-ci.yml
    with:
      working_directory: fixtures/consumer
      cache_dependency_path: fixtures/consumer/package-lock.json
