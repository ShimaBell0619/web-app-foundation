name: Prepare v0.7.1

on:
  push:
    branches:
      - release/v0.7.1

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/v0.7.1
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate release state
        run: npm run version-packages
      - name: Commit generated release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md AGENTS.md CHANGELOG.md .changeset/calm-chats-reuse-evidence.md
          if git diff --cached --quiet; then
            echo "No generated release changes"
            exit 0
          fi
          git commit -m "chore: prepare v0.7.1 release state"
          git push origin HEAD:release/v0.7.1
