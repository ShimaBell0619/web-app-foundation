name: Implement UI profile

on:
  push:
    branches: [feat/issue-39-ui-profile]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: feat/issue-39-ui-profile
          fetch-depth: 0

      - name: Apply primitive-first UI profile
        shell: bash
        run: |
          set -euo pipefail

          cat > docs/ui-implementation.md <<'EOF'
          # Primitive-first UI implementation profile

          This document defines the default UI implementation profile for the current React-oriented Web App Foundation baseline. It complements `DESIGN.md`, which owns product-specific experience and visual direction, and `docs/ui-review.md`, which owns the rendered-review method.

          The goal is to avoid two opposite failure modes:

          1. rebuilding generic controls and accessibility behavior from scratch only to make the application feel "custom";
          2. assembling an application from component-library demo layouts until every product looks like the same generic SaaS template.

          The Foundation instead separates **primitive quality** from **product composition**.

          ## Default layering

          For a new React + TypeScript browser-first consumer, use this layering as the default starting point:

          ```text
          PRODUCT.md / DESIGN.md
                  ↓
          page composition + product-specific semantic components
                  ↓
          generic primitive layer (for example components/ui)
                  ↓
          Tailwind CSS styling infrastructure + design tokens
                  ↓
          semantic HTML / browser behavior / accessible primitive internals
          ```

          The current recommended implementation profile is:

          - **Tailwind CSS** as styling infrastructure and token/application-theme wiring;
          - **shadcn/ui-style accessible primitives** for common controls, using source-owned components and Radix or equivalent accessible internals where they add value;
          - application-owned **product-specific semantic components** above those generic primitives.

          This is a default profile, not a shared visual skin and not a universal framework dependency.

          ## Generic primitives

          Common controls should normally start from mature, accessible primitives rather than bespoke application CSS/interaction code. Typical examples include Button, Dialog, Input, Select, DropdownMenu, Tooltip, Tabs, Checkbox, and reusable Table or Skeleton patterns.

          Keep the generic primitive layer free of product-domain meaning. A directory such as `components/ui` may define a button's size, focus treatment, disabled behavior, or reusable visual variants, but it should not know about a specific credential, invoice, deployment, booking, or other product concept.

          Source-owned shadcn/ui-style code remains application code. Review it like any other dependency boundary: keep only the primitives the product needs, preserve accessibility behavior, and avoid turning generated source into an unreviewed dumping ground for product-specific variants.

          ## Product-specific semantic components

          Product meaning belongs above the generic primitive layer. Prefer APIs named after durable product concepts or user tasks rather than arbitrary visual appearance.

          A semantic component may compose generic buttons, dialogs, tables, icons, typography, and tokens, while owning product-specific rules such as:

          - which state is most important;
          - which action should dominate;
          - how domain data is grouped or compared;
          - when information is hidden, condensed, or reordered responsively;
          - what text accompanies a color/icon state;
          - what empty, warning, success, or error state means to the user.

          Product identity should primarily come from information hierarchy, composition, typography, semantic color, density, data presentation, and interaction flow—not from reimplementing ordinary controls solely to look unique.

          ## Composition is not inherited from the component library

          Using shadcn/ui-style primitives does **not** make shadcn demo/page composition the application's information architecture.

          Treat the following as composition review signals rather than component bans:

          - wrapping every section in Card/Surface;
          - repeating Card + Icon + Heading + muted-copy structures;
          - using Badge/pill treatment for every status or metadata value;
          - equal KPI cards for information with unequal importance;
          - applying the same radius, shadow, and elevation to every region;
          - adding a marketing-style hero to a task-oriented tool without a product reason;
          - decorative gradients, glows, or large whitespace whose only rationale is "modern";
          - copying a component-library demo/page composition and replacing only the text.

          Cards, badges, radii, shadows, popovers, dialogs, and other common affordances remain valid when they clarify grouping, state, action, or layering. The corrective question is whether the element's role and visual weight are justified by product data, workflow, hierarchy, or accessibility.

          ## Tailwind and design tokens

          Tailwind CSS is infrastructure, not product identity. Use semantic theme variables/tokens for durable roles such as background, surface, foreground, muted text, border, primary action, warning, success, radius, shadow, spacing, and typography where the product needs them.

          Avoid scattering one-off literal values until utilities themselves become an accidental, undocumented design system. The application's `DESIGN.md` remains authoritative for token intent and product-specific visual rationale.

          ## Specialist custom CSS

          Tailwind utilities and generic primitives are the default, not a prohibition on CSS.

          **Specialist custom CSS** is appropriate when a product-specific visualization or interaction is materially clearer that way—for example proportional timelines, unusual data-density layouts, complex map/chart overlays, or another visualization whose semantics do not map cleanly to standard primitives.

          Do not use custom CSS to rebuild routine focus handling, dialog overlays, keyboard navigation, input states, or standard button behavior that a proven primitive already supplies.

          ## Existing consumers and deviations

          Existing consumers are not required to migrate solely because this profile becomes the Foundation default. A migration should have a real objective—accessibility, maintainability, consistency, UI redesign, or another approved benefit—and should be reviewed as a material UI change.

          React/Next.js consumers may normally use the same profile where it fits their architecture. A non-React consumer, an application with an established accessible design system, or a product with a justified incompatible constraint may use an equivalent mature primitive approach instead.

          Record meaningful deviations in the consumer's `DESIGN.md`, `AGENTS.md`, or Foundation provenance as appropriate. The required invariant is the responsibility boundary: generic control behavior should be solved at the primitive layer, while product identity and semantics remain application-owned.

          ## Adoption sequence

          For a new React consumer:

          1. Define the product task, information hierarchy, and visual direction in `PRODUCT.md` / `DESIGN.md` before choosing page composition.
          2. Establish Tailwind CSS and semantic design tokens.
          3. Add only the generic shadcn/ui-style primitives currently needed by the application.
          4. Build product-specific semantic components above those primitives.
          5. Compose the page from the product hierarchy rather than a component-library demo layout.
          6. Run the rendered-review loop from `docs/ui-review.md` and correct hierarchy/composition issues without discarding sound primitive foundations merely to appear more custom.

          For an existing consumer, migrate incrementally when practical. Do not mix two interaction implementations indefinitely, but do not rewrite stable generic controls without a clear migration goal.

          ## Review boundary

          Review both layers independently:

          - **primitive quality**: semantics, keyboard behavior, focus, labels, disabled/error states, overlay behavior, accessible names, consistency;
          - **composition quality**: hierarchy, area allocation, grouping, duplication, task flow, responsive ordering, typography, density, and whether supporting features displace primary work.

          A screen can use excellent primitives and still have poor UX because its composition is wrong. Conversely, a visually distinctive composition is not a reason to accept fragile custom control behavior.

          Use `docs/ui-review.md` for render → critique → fix → re-render and the 1440px / 390px / 320px baseline.

          ## Provenance of this profile

          This profile was generalized after a real consumer migration and follow-up UX review. The evidence showed that a mature primitive foundation could remain intact while the page-level information architecture was redesigned substantially. The Foundation therefore generalizes the layering decision, not the consumer's colors, density, domain components, timelines, or page layout.
          EOF

          cat > scripts/validate-ui-profile.mjs <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';

          const failures = [];
          const fail = (message) => failures.push(message);
          const read = (path) => readFileSync(path, 'utf8');

          const requiredFiles = [
            'docs/ui-implementation.md',
            'DESIGN.base.md',
            'AGENTS.md',
            'docs/ui-review.md',
            'docs/adoption.md',
            'README.md',
          ];

          for (const path of requiredFiles) {
            if (!existsSync(path)) fail(`missing UI profile contract file: ${path}`);
          }

          if (failures.length === 0) {
            const profile = read('docs/ui-implementation.md');
            const profileMarkers = [
              'Tailwind CSS',
              'shadcn/ui-style accessible primitives',
              'generic primitive layer',
              'product-specific semantic components',
              'component-library demo/page composition',
              'Specialist custom CSS',
              'Existing consumers',
              'non-React consumer',
              'primitive quality',
              'composition quality',
            ];
            for (const marker of profileMarkers) {
              if (!profile.toLowerCase().includes(marker.toLowerCase())) {
                fail(`docs/ui-implementation.md missing contract marker: ${marker}`);
              }
            }

            for (const forbidden of ['Azure Blue', 'CredentialStatus', 'RenewalTimeline']) {
              if (profile.toLowerCase().includes(forbidden.toLowerCase())) {
                fail(`docs/ui-implementation.md must not encode consumer-specific visual/domain contract: ${forbidden}`);
              }
            }

            for (const path of ['DESIGN.base.md', 'AGENTS.md', 'docs/ui-review.md', 'docs/adoption.md', 'README.md']) {
              const text = read(path);
              if (!text.includes('docs/ui-implementation.md')) {
                fail(`${path} must reference docs/ui-implementation.md`);
              }
            }

            const review = read('docs/ui-review.md').toLowerCase();
            if (!review.includes('primitive quality') || !review.includes('composition quality')) {
              fail('docs/ui-review.md must distinguish primitive quality from composition quality');
            }
          }

          if (failures.length > 0) {
            for (const message of failures) console.error(`- ${message}`);
            process.exit(1);
          }

          console.log('Primitive-first UI profile contract is valid.');
          EOF

          cat > scripts/test-ui-profile-contract.mjs <<'EOF'
          import { cpSync, mkdtempSync, mkdirSync, readFileSync, rmSync, unlinkSync, writeFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { tmpdir } from 'node:os';
          import { spawnSync } from 'node:child_process';

          const validatorPath = 'scripts/validate-ui-profile.mjs';
          const files = [
            validatorPath,
            'docs/ui-implementation.md',
            'DESIGN.base.md',
            'AGENTS.md',
            'docs/ui-review.md',
            'docs/adoption.md',
            'README.md',
          ];
          const dirs = [];

          function makeCopy() {
            const dir = mkdtempSync(join(tmpdir(), 'web-foundation-ui-profile-'));
            dirs.push(dir);
            for (const file of files) {
              const target = join(dir, file);
              mkdirSync(dirname(target), { recursive: true });
              cpSync(file, target);
            }
            return dir;
          }

          function mutate(dir, file, transform, label) {
            const path = join(dir, file);
            const before = readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${label}: mutation did not change ${file}`);
            writeFileSync(path, after);
          }

          function run(dir, shouldPass, label) {
            const result = spawnSync(process.execPath, [validatorPath], { cwd: dir, encoding: 'utf8' });
            const passed = result.status === 0;
            if (passed !== shouldPass) {
              throw new Error(`${label}: expected ${shouldPass ? 'success' : 'failure'}\nstdout:\n${result.stdout}\nstderr:\n${result.stderr}`);
            }
          }

          try {
            run(resolve('.'), true, 'current UI profile');

            {
              const dir = makeCopy();
              unlinkSync(join(dir, 'docs/ui-implementation.md'));
              run(dir, false, 'missing profile document');
            }

            {
              const dir = makeCopy();
              mutate(dir, 'docs/ui-implementation.md', (text) => text.replace('Tailwind CSS', 'utility framework'), 'Tailwind marker');
              run(dir, false, 'missing default styling profile');
            }

            {
              const dir = makeCopy();
              mutate(dir, 'AGENTS.md', (text) => text.replaceAll('docs/ui-implementation.md', 'docs/ui-profile-removed.md'), 'AGENTS profile reference');
              run(dir, false, 'AGENTS loses profile reference');
            }

            {
              const dir = makeCopy();
              mutate(dir, 'docs/ui-implementation.md', (text) => text.replace('Specialist custom CSS', 'No custom styles'), 'custom CSS allowance');
              run(dir, false, 'specialist CSS allowance removed');
            }

            {
              const dir = makeCopy();
              mutate(dir, 'docs/ui-review.md', (text) => text.replaceAll('composition quality', 'layout review'), 'composition review boundary');
              run(dir, false, 'UI review loses primitive/composition distinction');
            }

            {
              const dir = makeCopy();
              mutate(dir, 'docs/ui-implementation.md', (text) => `${text}\nUse Azure Blue as the shared Foundation accent.\n`, 'consumer skin mutation');
              run(dir, false, 'consumer-specific skin leaks into Foundation');
            }

            console.log('Primitive-first UI profile regression tests passed.');
          } finally {
            for (const dir of dirs) rmSync(dir, { recursive: true, force: true });
          }
          EOF

          cat > .changeset/primitive-first-ui-profile.md <<'EOF'
          ---
          "web-app-foundation": minor
          ---

          Add a primitive-first React UI implementation profile: Tailwind CSS styling infrastructure, shadcn/ui-style accessible generic primitives, product-specific semantic composition, explicit demo-layout guardrails, and a documented custom-CSS/deviation boundary backed by contract validation.
          EOF

          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, needle, replacement) {
            const before = fs.readFileSync(path, 'utf8');
            const count = before.split(needle).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one anchor, found ${count}: ${needle.slice(0, 80)}`);
            fs.writeFileSync(path, before.replace(needle, replacement));
          }

          replaceOnce(
            'package.json',
            '"foundation:validate": "node scripts/validate-foundation.mjs && node scripts/validate-independent-review.mjs",',
            '"foundation:validate": "node scripts/validate-foundation.mjs && node scripts/validate-independent-review.mjs && node scripts/validate-ui-profile.mjs",',
          );
          replaceOnce(
            'package.json',
            '"foundation:test": "node scripts/test-foundation-validator.mjs && node scripts/test-independent-review-contract.mjs",',
            '"foundation:test": "node scripts/test-foundation-validator.mjs && node scripts/test-independent-review-contract.mjs && node scripts/test-ui-profile-contract.mjs",',
          );

          replaceOnce(
            'README.md',
            'These are defaults, not permanent restrictions; SSR, server components, API routes, backend services, databases, or alternative frameworks are introduced when product requirements justify them.\n\n## AI development lifecycle',
            'These are defaults, not permanent restrictions; SSR, server components, API routes, backend services, databases, or alternative frameworks are introduced when product requirements justify them.\n\n## Default UI implementation profile\n\nFor new React-oriented browser-first consumers, the default UI implementation profile is **Tailwind CSS + shadcn/ui-style accessible primitives + product-specific semantic composition**. Generic controls should come from mature primitives; product identity should come from information hierarchy, layout, tokens, typography, density, data presentation, and interaction flow rather than bespoke reimplementation of routine controls.\n\nThe profile is a default, not a forced shared skin. Existing consumers are not required to migrate solely for conformity, and non-React or established-design-system consumers may document an equivalent accessible primitive approach. See `docs/ui-implementation.md` for the layering, custom-CSS boundary, demo-composition guardrails, and deviation rules.\n\n## AI development lifecycle',
          );
          replaceOnce(
            'README.md',
            'See `docs/adoption.md`, `docs/independent-review.md`, `docs/ci-performance.md`, `docs/pages.md`, `docs/vercel.md`, `docs/vercel-fixed-staging.md`, `docs/application-releases.md`, `docs/azure-oidc.md`, and `docs/versioning.md` for the detailed contracts.',
            'See `docs/adoption.md`, `docs/ui-implementation.md`, `docs/ui-review.md`, `docs/independent-review.md`, `docs/ci-performance.md`, `docs/pages.md`, `docs/vercel.md`, `docs/vercel-fixed-staging.md`, `docs/application-releases.md`, `docs/azure-oidc.md`, and `docs/versioning.md` for the detailed contracts.',
          );

          replaceOnce(
            'AGENTS.md',
            '- Prefer semantic HTML, native browser behavior, progressive enhancement, and accessible primitives.\n- Preserve keyboard support, visible focus, meaningful labels, error association, and appropriate target sizing.',
            '- Prefer semantic HTML, native browser behavior, progressive enhancement, and accessible primitives.\n- For a new React-oriented browser-first consumer, use the default primitive-first profile in `docs/ui-implementation.md` unless the application documents a justified deviation: Tailwind CSS for styling infrastructure, shadcn/ui-style accessible generic primitives, and product-specific semantic components above them.\n- Keep a generic primitive layer such as `components/ui` free of product-domain meaning; product-specific state, hierarchy, actions, and presentation belong in semantic components above it.\n- Do not copy component-library demo/page composition as the application information architecture. Primitive reuse does not determine page composition.\n- Do not rebuild routine button, input, dialog, overlay, focus, or keyboard behavior in bespoke CSS when a reviewed mature primitive already supplies it; specialist custom CSS remains valid for justified product-specific visualizations/interactions.\n- Existing consumers do not require a migration solely to conform to the default profile; treat a migration as material UI work with an explicit objective and rendered review.\n- Preserve keyboard support, visible focus, meaningful labels, error association, and appropriate target sizing.',
          );

          replaceOnce(
            'DESIGN.base.md',
            'The Foundation does not prescribe a shared product skin. Do not copy another consumer\'s colors, radii, typography, motifs, or dashboard structure merely because that consumer validated a useful design principle.\n\n## Colors',
            'The Foundation does not prescribe a shared product skin. Do not copy another consumer\'s colors, radii, typography, motifs, or dashboard structure merely because that consumer validated a useful design principle.\n\nImplementation primitives and product visual identity are separate concerns. For the current React baseline, `docs/ui-implementation.md` defines the default primitive-first layering; this `DESIGN.md` remains authoritative for the application\'s information hierarchy, composition, token meaning, typography, density, and visual rationale.\n\n## Colors',
          );
          replaceOnce(
            'DESIGN.base.md',
            '- Prefer semantic HTML and accessible platform behavior before custom interaction primitives.\n- Reuse proven component primitives when they improve accessibility and consistency.\n- Create app-specific reusable components only when a real pattern repeats or expresses a durable product interaction rule.',
            '- Prefer semantic HTML and accessible platform behavior before custom interaction primitives.\n- For the current React baseline, start common controls from the default profile in `docs/ui-implementation.md`: Tailwind CSS styling infrastructure plus shadcn/ui-style accessible generic primitives where applicable.\n- Keep generic primitive code free of product-domain meaning, and build product-specific semantic components above it.\n- Reuse proven component primitives when they improve accessibility and consistency.\n- Create app-specific reusable components only when a real pattern repeats or expresses a durable product interaction rule.\n- Derive product identity from hierarchy, composition, typography, semantic color, density, data presentation, and interaction flow rather than bespoke reinvention of routine controls.\n- Keep specialist custom CSS when it clearly improves a product-specific visualization or interaction that generic utilities/primitives do not express well.',
          );
          replaceOnce(
            'DESIGN.base.md',
            '- Do not mechanically ban common visual patterns in the name of avoiding AI-generated design; require a product reason and keep useful patterns when they genuinely serve the task.\n- Do not imitate a vendor\'s visual language when the consumer\'s task or information hierarchy is different.',
            '- Do not mechanically ban common visual patterns in the name of avoiding AI-generated design; require a product reason and keep useful patterns when they genuinely serve the task.\n- Do not copy a component-library demo/page composition and treat primitive defaults as the product information architecture.\n- Do not imitate a vendor\'s visual language when the consumer\'s task or information hierarchy is different.',
          );
          replaceOnce(
            'DESIGN.base.md',
            'See `docs/ui-review.md` in the Foundation repository for the rendered-review method, generic/AI-template review signals, viewport baseline, accessibility checks, and Japanese/CJK rendering notes.',
            'See `docs/ui-implementation.md` for the primitive-first implementation profile and `docs/ui-review.md` for the rendered-review method, generic/AI-template review signals, viewport baseline, accessibility checks, and Japanese/CJK rendering notes.',
          );

          replaceOnce(
            'docs/ui-review.md',
            '## Generic / AI-template review signals',
            '## Separate primitive quality from composition quality\n\nReview the generic control layer and the page composition as separate quality dimensions. A screen can use excellent accessible primitives and still have weak UX because the hierarchy, area allocation, grouping, duplication, or task flow is wrong. Conversely, a distinctive composition is not a reason to accept fragile custom control behavior.\n\nFor consumers using the default React profile in `docs/ui-implementation.md`:\n\n- **primitive quality** covers semantic HTML, keyboard/focus behavior, labels and accessible names, disabled/error states, target sizing, dialog/popover behavior, and consistency of generic controls;\n- **composition quality** covers information hierarchy, primary-versus-supporting area allocation, grouping, repeated information, semantic component boundaries, responsive ordering, density, typography, and whether the user can move from state recognition to the next relevant action.\n\nDo not respond to a composition problem by discarding a sound primitive foundation merely to make the UI appear more custom. Change the composition, semantic components, tokens, or hierarchy first when those are the actual source of the problem.\n\n## Generic / AI-template review signals',
          );
          replaceOnce(
            'docs/ui-review.md',
            '- repeated rounded cards or pills that add containment without clarifying grouping or interaction,',
            '- repeated rounded cards or pills that add containment without clarifying grouping or interaction,\n- repeated Card + Icon + Heading + muted-copy composition inherited from a component-library demo rather than the product hierarchy,\n- identical radius/shadow/elevation treatment across unrelated component roles,',
          );
          replaceOnce(
            'docs/ui-review.md',
            '- Foundation owns reusable guidance/templates and shared engineering contracts.',
            '- Foundation owns reusable guidance/templates and shared engineering contracts, including the default primitive-first implementation profile in `docs/ui-implementation.md`.',
          );

          replaceOnce(
            'docs/adoption.md',
            '3. Copy `DESIGN.base.md` to `DESIGN.md`, preserve the Google DESIGN.md alpha structure, and add application-specific tokens/rationale. For material UI work, use `docs/ui-review.md` to validate the rendered result against that product-specific direction.',
            '3. Copy `DESIGN.base.md` to `DESIGN.md`, preserve the Google DESIGN.md alpha structure, and add application-specific tokens/rationale. For a new React-oriented browser-first UI, adopt the default primitive-first profile in `docs/ui-implementation.md`; for material UI work, use `docs/ui-review.md` to validate the rendered result against that product-specific direction.',
          );
          replaceOnce(
            'docs/adoption.md',
            'The guide is intentionally style-neutral: consumers keep their own visual direction and product-specific assertions in `DESIGN.md` and application tests.\n\n## Selective independent code review',
            'The guide is intentionally style-neutral: consumers keep their own visual direction and product-specific assertions in `DESIGN.md` and application tests.\n\n## Default React UI implementation profile\n\nFor a new React-oriented browser-first consumer, use `docs/ui-implementation.md` as the default implementation layer beneath the product-specific `DESIGN.md`:\n\n- Tailwind CSS provides styling infrastructure and semantic token wiring;\n- shadcn/ui-style accessible primitives provide common interaction controls without forcing page composition;\n- a generic primitive layer stays free of product-domain meaning;\n- product-specific semantic components own hierarchy, domain state, actions, and data presentation;\n- specialist custom CSS remains valid for justified product-specific visualizations/interactions;\n- rendered review evaluates primitive quality and composition quality separately.\n\nDo not force-migrate an existing consumer only for conformity. Non-React consumers or applications with an established accessible design system may use an equivalent mature primitive approach and record the deviation in `DESIGN.md`, `AGENTS.md`, or Foundation provenance as appropriate.\n\n## Selective independent code review',
          );
          NODE

          rm .github/workflows/_implement-ui-profile.yml

          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'));"
          node scripts/validate-ui-profile.mjs
          node scripts/test-ui-profile-contract.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add primitive-first UI implementation profile'
          git push origin HEAD:feat/issue-39-ui-profile
