name: Apply Issue 47 refinement

on:
  push:
    branches:
      - docs/issue-47-evidence-reuse

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/issue-47-evidence-reuse
      - name: Apply focused contract refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          old = """- Use Bootstrap Read once for a new Issue and Incremental Read for later corrections. Do not repeatedly fetch unchanged contracts merely to recreate context.\n- Optimize GitHub I/O around coherent read/write batches, but preserve expected-HEAD checks, non-force updates, conflict reconciliation, security boundaries, and final evidence.\n"""
          new = """- Use Bootstrap Read once for a new Issue and Incremental Read for later corrections. Do not repeatedly fetch unchanged contracts merely to recreate context. Reuse revision-bound evidence and known resource/run identifiers while they remain valid; refresh mutable state when freshness or staleness requires it.\n- When an Acceptance Criterion expects existing behavior to be preserved but proof is missing, add or run the smallest focused validation before changing stable production code when practical; missing evidence is not itself a defect.\n- Optimize GitHub I/O around coherent read/write batches, but preserve expected-HEAD checks, non-force updates, conflict reconciliation, security boundaries, and final evidence.\n"""
          assert text.count(old) == 1
          agents.write_text(text.replace(old, new))

          guide = Path('docs/ai-implementation.md')
          text = guide.read_text()
          old = """Validation / review profile\n- focused checks\n- full validation\n- rendered checks when applicable\n- independent-review risk decision\n\nState\n- unresolved conflicts / approvals\n- rerouting triggers\n- staleness observations\n"""
          new = """Validation / review profile\n- focused checks\n- full validation\n- rendered checks when applicable\n- independent-review risk decision\n\nObserved evidence\n- resource/revision/run identifiers already observed and useful for reuse\n- validation results tied to a specific reviewed SHA when applicable\n\nState\n- unresolved conflicts / approvals\n- rerouting triggers\n- staleness observations\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """The packet should reference source paths/sections rather than copy large blocks of contract prose. Do not commit the packet as `CONTEXT.md`, paste it wholesale into an Issue, or treat chat memory as authoritative when it conflicts with the repository revision recorded in the packet.\n"""
          new = old + """\nRetain only enough observed evidence to avoid rediscovering resources that are already identified for this session. This is not a persistent cache: the observation remains useful only while its revision or resource identity still supports the current decision.\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """- external documentation only when a material version/runtime/API uncertainty has appeared.\n\nIf the base branch advances, compare the original base with the new base. Refresh the packet when the drift changes a routed contract, implementation surface, relevant test, dependency/runtime assumption, or conflict-sensitive file. Do not invalidate the entire packet only because an unrelated commit landed.\n"""
          new = """- external documentation only when a material version/runtime/API uncertainty has appeared.\n\nReuse observations that are explicitly bound to an unchanged revision or stable resource identity instead of repeating broad discovery. For example, a file already fetched at the recorded commit SHA does not need to be fetched again merely to reconfirm the same content.\n\nMutable current state is different: refresh it when the answer depends on its current value, when a write may have changed it, or when an existing staleness/rerouting trigger applies. Once a workflow run or job ID is known, poll that known resource directly rather than repeatedly rediscovering it from a broad run listing unless discovery itself must be refreshed.\n\nIf the base branch advances, compare the original base with the new base. Refresh the packet when the drift changes a routed contract, implementation surface, relevant test, dependency/runtime assumption, or conflict-sensitive file. Do not invalidate the entire packet only because an unrelated commit landed.\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """implementation + test batch\n```\n\nPreferred write pattern for a coherent multi-file change when Git data operations are available:\n"""
          new = """implementation + test batch\n```\n\nWhen discovery returns a stable identifier or revision-bound resource, retain and reuse it for subsequent direct reads or polling. Do not rerun repository-wide search/list operations only to recover an identifier already known to the current packet.\n\nPreferred write pattern for a coherent multi-file change when Git data operations are available:\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """Do not run the entire CI suite after every tiny edit. Conversely, do not defer all validation until a large unreviewable change has accumulated. The coherent candidate defined by the Implementation Map is the normal validation boundary.\n\nUser-facing UI work retains the existing `render -> critique -> fix -> re-render` loop from `docs/ui-review.md`. Render coherent UI batches at relevant desktop/mobile/narrow boundaries instead of taking a new Preview after every small CSS edit.\n"""
          new = """Do not run the entire CI suite after every tiny edit. Conversely, do not defer all validation until a large unreviewable change has accumulated. The coherent candidate defined by the Implementation Map is the normal validation boundary.\n\nWhen an Acceptance Criterion says existing behavior must be preserved but the Implementation Map reveals that proof is missing, distinguish an evidence gap from a known defect. When practical, add or run the smallest focused validation that can tell those states apart before altering stable production code. If the evidence passes, leave the production path unchanged; if it fails, correct the behavior and revalidate normally. This rule does not apply when the requested change itself requires new production behavior.\n\nUser-facing UI work retains the existing `render -> critique -> fix -> re-render` loop from `docs/ui-review.md`. Render coherent UI batches at relevant desktop/mobile/narrow boundaries instead of taking a new Preview after every small CSS edit.\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """- Does every Acceptance Criterion have implementation and evidence?\n- Does the final diff preserve each `must preserve` constraint?\n"""
          new = """- Does every Acceptance Criterion have implementation and evidence?\n- Is an apparent finding actually only missing evidence for behavior expected to be preserved, and if so was focused validation used before changing stable production code?\n- Does the final diff preserve each `must preserve` constraint?\n"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """- a permanent `CONTEXT.md`;\n- a vector database, context service, prompt registry, or runtime agent framework;\n"""
          new = """- a permanent `CONTEXT.md`;\n- a persistent cross-session fetch cache or evidence store;\n- a vector database, context service, prompt registry, or runtime agent framework;\n"""
          assert text.count(old) == 1
          guide.write_text(text.replace(old, new))

          changeset = Path('.changeset/calm-chats-reuse-evidence.md')
          changeset.write_text('''---\n"web-app-foundation": patch\n---\n\nRefine the context-routed Chat implementation profile to reuse revision-bound evidence and known run identifiers, and to validate missing evidence before changing stable production behavior.\n''')
          PY
      - name: Commit focused refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/ai-implementation.md .changeset/calm-chats-reuse-evidence.md
          git diff --cached --check
          git commit -m "docs: refine evidence reuse in Chat implementation"
          git push origin HEAD:docs/issue-47-evidence-reuse
