name: Recover UI profile implementation

on:
  push:
    branches: [feat/issue-39-ui-profile]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: feat/issue-39-ui-profile
          fetch-depth: 0

      - name: Reuse implementation with corrected regression mutation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_implement-ui-profile.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          script_lines = []
          for line in source[start:].splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              else:
                  break
          script = '\n'.join(script_lines) + '\n'
          old = "text.replace('Tailwind CSS', 'utility framework')"
          new = "text.replaceAll('Tailwind CSS', 'utility framework')"
          if script.count(old) != 1:
              raise SystemExit(f'expected one Tailwind mutation, found {script.count(old)}')
          script = script.replace(old, new)
          Path('/tmp/apply-ui-profile.sh').write_text(script)
          PY

          bash /tmp/apply-ui-profile.sh

          git pull --ff-only origin feat/issue-39-ui-profile
          rm .github/workflows/_recover-ui-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary UI profile recovery workflow'
          git push origin HEAD:feat/issue-39-ui-profile
