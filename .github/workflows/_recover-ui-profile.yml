name: Recover UI profile implementation

on:
  push:
    branches: [feat/issue-39-ui-profile]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: feat/issue-39-ui-profile
          fetch-depth: 0

      - name: Reuse implementation with corrected regression mutations
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/_implement-ui-profile.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          script_lines = []
          for line in source[start:].splitlines():
              if not line.strip():
                  script_lines.append('')
                  continue
              if line.startswith('          '):
                  script_lines.append(line[10:])
                  continue
              break
          script = '\n'.join(script_lines) + '\n'
          replacements = {
              "text.replace('Tailwind CSS', 'utility framework')": "text.replaceAll('Tailwind CSS', 'utility framework')",
              "text.replace('Specialist custom CSS', 'No custom styles')": "text.replaceAll('Specialist custom CSS', 'No custom styles')",
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f'expected one regression mutation expression, found {script.count(old)}: {old}')
              script = script.replace(old, new)
          Path('/tmp/apply-ui-profile.sh').write_text(script)
          PY

          bash /tmp/apply-ui-profile.sh

          git pull --ff-only origin feat/issue-39-ui-profile
          rm .github/workflows/_recover-ui-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary UI profile recovery workflow'
          git push origin HEAD:feat/issue-39-ui-profile
