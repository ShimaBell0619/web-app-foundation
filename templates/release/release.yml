name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

env:
  # Set to 'true' for a GitHub prerelease milestone.
  PRERELEASE: 'false'

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 2

      - name: Detect explicit version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          previous="$(git show HEAD^:package.json 2>/dev/null | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => console.log(JSON.parse(s).version));" || true)"

          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported application version: $current" >&2
            exit 1
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"

          if [[ "$current" == "$previous" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Application version did not change ($current); no release requested."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Application version changed: ${previous:-<none>} -> $current"
          fi

      - name: Verify release target
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [[ "$existing" == "$VALIDATED_SHA" ]]; then
              echo "Release $TAG already exists at validated SHA; nothing to do."
              exit 0
            fi
            echo "Release $TAG already exists with unexpected target: $existing" >&2
            exit 1
          fi

          remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$remote_sha" && "$remote_sha" != "$VALIDATED_SHA" ]]; then
            echo "Tag $TAG already points to $remote_sha instead of $VALIDATED_SHA" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          prerelease_args=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${prerelease_args[@]}"
