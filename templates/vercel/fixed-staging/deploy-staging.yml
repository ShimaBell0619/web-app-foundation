name: Deploy PR to Fixed Staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR number to place in the fixed Staging slot'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: fixed-staging-deploy-slot
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      STAGING_URL: ${{ vars.FIXED_STAGING_URL }}
      STAGING_WORKFLOW_FILE: deploy-staging.yml

    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Move fixed Staging slot to PR HEAD
        run: node scripts/staging-slot.mjs deploy
