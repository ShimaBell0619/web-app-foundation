name: Owner Chat Private Repository Creation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  create:
    if: >-
      ${{ github.event.comment.body == '/create-private-repo' &&
          github.event.comment.author_association == 'OWNER' &&
          !github.event.issue.pull_request &&
          startsWith(github.event.issue.title, 'repo-create: ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: repo-creation-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted Foundation main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Create only an owner-approved private repository
        env:
          REPO_CREATION_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
        run: node kits/github/repository-create/create-private-repo.mjs
