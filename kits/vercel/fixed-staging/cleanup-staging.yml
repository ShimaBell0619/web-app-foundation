name: Cleanup Fixed Staging

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: fixed-staging-deploy-slot
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOSED_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Reset Staging only when the closed PR still owns the slot
        run: node scripts/staging-slot.mjs cleanup
