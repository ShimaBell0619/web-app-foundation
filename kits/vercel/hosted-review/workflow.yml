name: On-demand Hosted Review

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [vercel.deployment.success]
  pull_request_target:
    types: [closed]

permissions: {}

# One serialized lane for concurrent requests and cleanup.
concurrency:
  group: hosted-review-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (github.event.comment.body == '/preview' || github.event.comment.body == '/staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.request.outputs.kind }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      comment_id: ${{ steps.request.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Authorize exact PR comment and resolve source A
        id: request
        run: node kits/vercel/hosted-review/hosted-review.mjs authorize

  validate-source:
    needs: authorize
    permissions:
      contents: read
    uses: ShimaBell0619/web-app-foundation/.github/workflows/web-ci.yml@c38ae4e8e70a7307d6ff6a38cbd59797d94ac93c
    with:
      checkout_ref: ${{ needs.authorize.outputs.source_sha }}
      node_version_file: .node-version
      cache_dependency_path: package-lock.json

  publish:
    needs: [authorize, validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_KIND: ${{ needs.authorize.outputs.kind }}
      PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      COMMENT_ID: ${{ needs.authorize.outputs.comment_id }}
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Publish content-identical synthetic child B
        run: node kits/vercel/hosted-review/hosted-review.mjs publish

  notify:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      FIXED_STAGING_URL: ${{ vars.FIXED_STAGING_URL }}
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify deployment with Vercel API before notifying
        run: node kits/vercel/hosted-review/hosted-review.mjs notify

  cleanup:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Cleanup only refs owned by the closed PR
        run: node kits/vercel/hosted-review/hosted-review.mjs cleanup
